<title>Coccinelle Supermarket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky storefront header over a full-width content column; staff console is a tabbed workspace; cart is a right drawer; assistant is a floating panel. */
:root{
  --bg:#f3f8ee; --surface:#ffffff; --surface2:#eaf3e1; --ink:#14261a; --muted:#566a5c; --line:#d8e5cf;
  --green:#2f7d32; --green-d:#1f5c2a; --leaf:#e3f0d4; --red:#e0262b; --red-d:#b81c21; --onred:#ffffff;
  --ok:#1f7a3d; --okbg:#dff3e3; --warn:#8a5a00; --warnbg:#fdf0cf; --bad:#a3191d; --badbg:#fbe0e0; --info:#1b5f8f; --infobg:#dcecf8;
  --foot:#1f5c2a; --onfoot:#e9f5e3; --shadow:0 6px 24px rgba(20,38,26,.08);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif; --f-script:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a12; --surface:#16261b; --surface2:#1c3123; --ink:#e7f2e4; --muted:#9db3a2; --line:#2a4231;
  --green:#58b85c; --green-d:#3f9a44; --leaf:#1e3524; --red:#ef4a4f; --red-d:#d63439; --onred:#fff;
  --ok:#7ddc92; --okbg:#173a22; --warn:#f3c969; --warnbg:#3a2f12; --bad:#ff8f93; --badbg:#431a1c; --info:#8cc7f0; --infobg:#142f45;
  --foot:#0b2a14; --onfoot:#d6ecd0; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a12; --surface:#16261b; --surface2:#1c3123; --ink:#e7f2e4; --muted:#9db3a2; --line:#2a4231;
  --green:#58b85c; --green-d:#3f9a44; --leaf:#1e3524; --red:#ef4a4f; --red-d:#d63439; --onred:#fff;
  --ok:#7ddc92; --okbg:#173a22; --warn:#f3c969; --warnbg:#3a2f12; --bad:#ff8f93; --badbg:#431a1c; --info:#8cc7f0; --infobg:#142f45;
  --foot:#0b2a14; --onfoot:#d6ecd0; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* test banner + top bar */
.testbar{background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:600;padding:6px 0;text-align:center;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:16px}
.topbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;font-size:12.5px;color:var(--muted)}
.topbar button{background:none;border:0;padding:0;color:inherit;font-weight:600}
.topbar button:hover{color:var(--green)}
.topbar .l{display:flex;gap:18px}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:12px 0 14px;border-top:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo b{display:block;font-family:var(--f-display);font-size:26px;letter-spacing:-.02em;line-height:.95;color:var(--ink)}
.logo small{display:block;font-size:11px;font-weight:700;color:var(--red);letter-spacing:.02em}
.search{display:flex;max-width:640px;width:100%;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.search select{border:0;background:var(--surface2);padding:0 10px;max-width:130px;font-size:13px;font-weight:600}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:12px 12px;outline:none}
.search button{border:0;background:var(--green);color:#fff;width:48px;font-weight:700}
.icons{display:flex;gap:6px}
.ibtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:4px 10px;position:relative;color:var(--ink)}
.ibtn svg{width:26px;height:26px}
.badge{position:absolute;top:-2px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.mainnav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.mainnav button{background:none;border:0;padding:8px 16px;font-weight:600;border-radius:999px;color:var(--ink)}
.mainnav button[aria-current="page"]{color:var(--green);box-shadow:inset 0 -2px 0 var(--green);border-radius:0}
.mainnav button:hover{color:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--green);color:#fff;text-decoration:none}
.btn:hover{background:var(--green-d)}
.btn.red{background:var(--red);color:var(--onred)}
.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;align-items:center;background:linear-gradient(120deg,var(--leaf),var(--bg) 70%);border-radius:0 0 28px 28px;padding:44px 40px 70px;margin-inline:-8px;overflow:hidden}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);letter-spacing:-.03em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero h2{font-size:clamp(1.15rem,2.2vw,1.55rem);color:var(--green-d);margin-bottom:10px}
.hero p{color:var(--muted);max-width:460px;margin:0 0 22px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero-art{justify-self:center;width:min(100%,430px);aspect-ratio:1}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px 24px;margin:-44px 24px 0;position:relative}
.trust div{display:flex;gap:12px;align-items:center}
.trust .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.trust b{display:block;font-size:14px;color:var(--green-d)}
.trust span{font-size:12.5px;color:var(--muted)}
.sec-title{display:flex;align-items:center;justify-content:center;gap:18px;margin:48px 0 22px;font-size:clamp(1.5rem,3vw,2rem)}
.sec-title::before,.sec-title::after{content:"";height:2px;width:clamp(24px,8vw,90px);background:var(--green)}
.sec-title em{font-style:normal;color:var(--green)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cat svg{width:92px;height:92px}
.cat b{font-family:var(--f-display);font-size:16px}
.cat small{color:var(--muted);font-size:12px}
.cat .btn{margin-top:6px;padding:7px 16px;font-size:12.5px}
.promo{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:center;background:linear-gradient(100deg,var(--leaf),var(--surface2));border-radius:22px;padding:26px 36px;margin-top:40px;overflow:hidden}
.promo .script{font-family:var(--f-script);font-size:30px;color:var(--green-d)}
.promo h3{font-size:clamp(1.5rem,3vw,2.2rem);margin:2px 0 10px}
.promo .big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,7vw,4.6rem);color:var(--red);letter-spacing:-.04em;line-height:1}
.promo .save{font-weight:700;font-size:1.3rem;letter-spacing:.03em}
.promo-art{display:flex;gap:6px;justify-content:center}
.promo-art svg{width:clamp(60px,12vw,120px)}
.fam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(100deg,var(--leaf),var(--bg));border-radius:22px;padding:32px 40px;margin-top:44px}
.fam h3{font-size:clamp(1.8rem,3.4vw,2.7rem);color:var(--green-d);margin:8px 0 10px}
.fam .script{font-family:var(--f-script);font-size:28px;color:var(--green-d);text-align:center}
.news{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 24px;margin:44px 0}
.news .ic{width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.news form{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.news input{flex:1;min-width:0;border:0;padding:11px 12px;background:var(--bg)}
.news button{border:0;background:var(--green);color:#fff;font-weight:700;padding:0 20px}
footer{background:var(--foot);color:var(--onfoot);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:36px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
footer .grid{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:28px}
footer h4{font-size:14px;margin-bottom:10px;color:#fff}
footer button,footer a{display:block;background:none;border:0;padding:3px 0;color:var(--onfoot);font-size:13.5px;text-align:left;text-decoration:none;opacity:.9}
footer button:hover,footer a:hover{text-decoration:underline;opacity:1}
footer p{font-size:13.5px;margin:6px 0}
footer .copy{border-top:1px solid rgba(255,255,255,.15);margin-top:26px;padding-top:14px;font-size:12px;text-align:center;opacity:.8}

/* products */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.prod .art{aspect-ratio:1.25;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.prod .art svg{width:62%;max-height:100%}
.prod h3{font-size:15px;font-family:var(--f-body);font-weight:700}
.prod .unit{font-size:12.5px;color:var(--muted)}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:16px}
.price s{font-size:12px;color:var(--muted)}
.price .off{font-size:11px;font-weight:700;background:var(--badbg);color:var(--bad);border-radius:6px;padding:1px 6px}
.stars{font-size:12px;color:#e8a317;letter-spacing:1px}
.stars span{color:var(--muted);letter-spacing:0;margin-left:4px}
.avail{font-size:11.5px;font-weight:600}
.avail.in{color:var(--ok)} .avail.low{color:var(--warn)} .avail.out{color:var(--bad)}
.prod .add{margin-top:auto;background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px;font-weight:700;font-size:13px}
.prod .add:hover{background:var(--green-d)}
.prod .add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}
.heart[aria-pressed="true"]{color:var(--red)}
.shop-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:24px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.note{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,8,.5);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:70;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px}
.xbtn{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.db{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.df{border-top:1px solid var(--line);padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.steps{display:flex;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.steps span{flex:1;padding:6px 0;border-bottom:3px solid var(--line)}
.steps span.on{color:var(--green);border-color:var(--green)}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.line .th{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.line .th svg{width:30px}
.line b{font-size:14px;display:block}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;font-weight:700}
.qty span{min-width:24px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:14px}
.tot.big{font-size:17px;font-weight:800}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.in{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--green);background:var(--leaf)}
.opt small{display:block;color:var(--muted);font-weight:400}
.alert{border-radius:12px;padding:10px 12px;font-size:13px}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert.info{background:var(--infobg);color:var(--info)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.info{background:var(--infobg);color:var(--info)} .pill.mute{background:var(--surface2);color:var(--muted)}
.track{display:flex;flex-direction:column;gap:12px}
.flow{display:flex;gap:4px;font-size:11px;font-weight:700}
.flow span{flex:1;text-align:center;padding:6px 2px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.flow span.done{background:var(--okbg);color:var(--ok)} .flow span.cur{background:var(--green);color:#fff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

/* chat */
.chatfab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;border:0;background:var(--red);color:#fff;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.chat{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;width:min(380px,calc(100% - 32px));height:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden}
.chat.on{display:flex}
.chat header{background:var(--green);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.chat header b{font-family:var(--f-display);font-size:17px}
.chat header small{display:block;font-size:11px;opacity:.85}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.m.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--green);color:#fff;align-self:flex-end}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:var(--surface)}
.quick button{border:1.5px solid var(--green);background:none;color:var(--green);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.chat form{display:flex;gap:8px;padding:10px 12px;background:var(--surface)}
.chat form input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(5,15,8,.55);padding:16px}
.modal.on{display:grid}
.mbox{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:92%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* staff console */
.console{margin:24px 0 40px;display:flex;flex-direction:column;gap:16px}
.crow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.roles{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.kpi b{font-family:var(--f-display);font-size:28px;display:block;line-height:1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.hot{border-color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--green);border-color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--leaf)}
tr.click{cursor:pointer}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.timer{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:20px}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.log div{border-left:3px solid var(--line);padding-left:10px}

/* ---------- data ---------- */
const O=(price,from,to,status,by,ver)=>({price,from,to,status,by,ver:ver||1});
const P=(id,sku,name,ar,cat,unit,price,offer,avail,kind,color,rate,rev)=>({id,sku,name,ar,cat,unit,price,offer,avail,availAt:Date.now()-3600e3,kind,color,rate,rev});
const CATS=[
 {id:'fruits',name:'Fruits',sub:'Fresh & Juicy',kind:'citrus',color:'#f59a23'},
 {id:'vegetables',name:'Vegetables',sub:'Farm Fresh',kind:'round',color:'#e03a2f'},

 {id:'pantry',name:'Pantry & Snacks',sub:'Everyday Essentials',kind:'jar',color:'#b9783c'}];
function seedProducts(){const A='2026-10-20',B='2026-11-02';return[
 P('p01','FRU-001','Sweet Oranges','برتقال حلو','fruits','1 kg',549,O(399,A,B,'approved','manager'),'in','citrus','#f59a23',4.5,124),
 P('p02','VEG-001','Broccoli','بروكلي','vegetables','500 g',749,O(549,A,B,'approved','manager'),'in','broc','#2f8f3a',4,98),
 P('p03','FRU-002','Red Apples','تفاح أحمر','fruits','1 kg',949,O(699,A,B,'approved','manager'),'in','round','#d62828',4.5,156),
 P('p04','VEG-002','Fresh Potatoes','بطاطس','vegetables','1 kg',349,O(249,A,B,'approved','manager'),'in','potato','#c9a46a',4,87),
 P('p05','FRU-003','Green Grapes','عنب أخضر','fruits','500 g',1099,O(799,A,B,'approved','manager'),'in','bunch','#9ccc4a',4.5,112),

 P('p07','FRU-004','Bananas','موز','fruits','1 kg',699,O(549,'2026-10-27','2026-11-03','draft','marketing'),'in','banana','#f4c430',4,64),
 P('p08','FRU-005','Strawberries','فراولة','fruits','250 g',1499,null,'low','berry','#d9262c',4.5,58),
 P('p09','VEG-004','Vine Tomatoes','طماطم','vegetables','1 kg',599,O(449,'2026-10-12','2026-10-20','approved','manager'),'in','round','#e03a2f',4,91),
 P('p10','VEG-005','Cucumbers','خيار','vegetables','1 kg',399,null,'in','cuc','#3c9a3f',4,45),
 P('p11','DAI-001','Fresh Milk','حليب طازج','dairy','1 L',699,null,'in','bottle','#e8f0f7',4.5,203),

 P('p13','DAI-003','Cheddar Cheese','جبنة شيدر','dairy','400 g',1999,null,'in','cheese','#f2b933',4,52),
 P('p14','BAK-001','Sourdough Loaf','خبز سوردو','bakery','600 g',1499,O(1199,'2026-10-27','2026-11-02','pending','marketing'),'in','loaf','#c98a4b',4.5,77),
 P('p15','BAK-002','Butter Croissants','كرواسون','bakery','4 pack',1299,O(999,A,B,'approved','manager'),'in','croissant','#d99a52',4.5,119),
 P('p16','MEA-001','Chicken Breast','صدر دجاج','meat','1 kg',2999,null,'in','meat','#f0b7a4',4,88),
 P('p17','MEA-002','Salmon Fillet','سلمون','meat','500 g',3999,O(3299,'2026-10-27','2026-11-02','pending','marketing'),'in','meat','#f27d5e',4.5,101),
 P('p18','MEA-003','Beef Mince','لحم مفروم','meat','500 g',2799,null,'out','meat','#b3303a',4,66),
 P('p19','PAN-001','Basmati Rice','أرز بسمتي','pantry','5 kg',3999,null,'in','bag','#e9d9b0',4.5,142),

const ROLES={superadmin:'Super Admin',manager:'Store Manager',marketing:'Marketing Staff',order:'Order Staff',payment:'Payment Staff',viewer:'Viewer / Auditor'};
const PERM={
 superadmin:['offers.edit','offers.approve','campaign.run','orders.act','orders.cancel','payments.verify','integrations.manage','audit.view'],
 manager:['offers.edit','offers.approve','campaign.run','orders.act','orders.cancel','audit.view'],

const TIMER_MS=15*60*1000;

const S={view:'home',cat:'all',q:'',offersOnly:false,role:'manager',tab:'orders',

/* ---------- pricing (authoritative) ---------- */
const prod=id=>S.products.find(p=>p.id===id);
const offerActive=p=>!!(p.offer&&p.offer.status==='approved'&&p.offer.from<=today()&&today()<=p.offer.to);
const unitPrice=p=>offerActive(p)?p.offer.price:p.price;
const pct=p=>Math.round((1-p.offer.price/p.price)*100);
function calc(lines,fulfil){const sub=lines.reduce((a,l)=>a+l.line,0);const fee=fulfil==='delivery'&&sub>0&&sub<FREE_OVER?FEE:0;return{sub,fee,total:sub+fee}}
function priceCart(fulfil){const lines=S.cart.map(c=>{const p=prod(c.id);const u=unitPrice(p);return{p,qty:c.qty,u,line:u*c.qty,seen:c.seen,changed:c.seen!==u}});return{lines,...calc(lines,fulfil||S.co.fulfil)}}

/* ---------- audit, perms ---------- */
function audit(action,target,reason,actor){S.audit.unshift({t:now(),actor:actor||ROLES[S.role],action,target:target||'',reason:reason||''})}
const can=p=>PERM[S.role].includes(p);
function guard(p,label){if(can(p))return true;audit('DENIED '+p,label||'', 'Server rejected: role lacks permission');toast('Denied by server: '+ROLES[S.role]+' cannot do this.');if(S.view==='staff')renderView();return false}

/* ---------- server-side order logic (simulated) ---------- */
function validateCustomer(o){
 if(o.name.trim().length<2)return 'Enter your full name.';
 if(!/^\+?[0-9 ]{7,15}$/.test(o.phone.trim()))return 'Enter a valid phone number, digits only.';
 if(o.fulfil==='delivery'&&o.address.trim().length<8)return 'Enter a delivery address (building, street, area).';
 return ''}
function serverCreateOrder(p,opt){
 opt=opt||{};
 if(S.idem[p.key])return{ok:true,order:S.idem[p.key],duplicate:true};
 if(!p.items.length)return{ok:false,error:'Your cart is empty.'};
 const err=validateCustomer(p);if(err)return{ok:false,error:err};
 if(!['card','bank'].includes(p.pay))return{ok:false,error:'Choose an online payment method. Cash on delivery is not offered.'};
 const lines=[];
 for(const it of p.items){
  const pr=prod(it.id);
  if(!pr)return{ok:false,error:'A product in your cart no longer exists.'};
  if(pr.avail==='out')return{ok:false,error:pr.name+' is marked out of stock. Remove it to continue.'};
  const qty=Math.floor(it.qty);if(!(qty>=1&&qty<=20))return{ok:false,error:'Quantity must be 1 to 20 for '+pr.name+'.'};
  const u=unitPrice(pr);lines.push({id:pr.id,sku:pr.sku,name:pr.name,unit:pr.unit,qty,u,line:u*qty,offer:offerActive(pr)});
 }
 const t=calc(lines,p.fulfil);
 let id;do{id='CC-'+today().slice(2).replace(/-/g,'')+'-'+pad(S.seq++,4)}while(S.orders.some(o=>o.id===id));
 const t0=opt.startedAt||now();
 const o={id,created:t0,items:lines,fulfil:p.fulfil,customer:{name:p.name.trim(),phone:p.phone.trim(),address:p.fulfil==='delivery'?p.address.trim():''},
  sub:t.sub,fee:t.fee,total:t.total,status:'Awaiting Staff Acceptance',
  pay:{method:p.pay,status:p.pay==='card'?'Awaiting payment (sandbox)':'Pending bank receipt',by:'',at:0,ref:''},
  timer:p.fulfil==='delivery'?{state:'running',start:t0,deadline:t0+TIMER_MS,offeredAt:0}:null,
  alert:false,hist:[{t:t0,text:'Customer confirmed order. Order number issued by server.'}]};
 if(o.timer)o.hist.push({t:t0,text:'Delivery requested. 15-minute staff response window started and order staff notified.'});
 S.orders.unshift(o);S.idem[p.key]=o;
 audit('Order created',id,'Customer confirmation received','Server');
 return{ok:true,order:o};
}
function seedOrders(){
 const mk=(key,name,phone,addr,fulfil,pay,items,ago)=>{const r=serverCreateOrder({key,name,phone,address:addr,fulfil,pay,items},{startedAt:now()-ago*60000});return r.order};
 mk('seed1','Layla Haddad','+971501234567','Building 12, Street 4, Mirdif','delivery','card',[{id:'p01',qty:2},{id:'p11',qty:1}],4);
 const o2=mk('seed2','Omar Siddiqui','+971559876543','','pickup','bank',[{id:'p15',qty:3},{id:'p14',qty:1}],38);
 mk('seed3','Nadia Perera','+971522223333','Villa 7, Uptown Mirdif','delivery','bank',[{id:'p19',qty:1},{id:'p06',qty:2},{id:'p03',qty:1}],9);
 o2.status='Awaiting Staff Acceptance';
 S.audit.length=0;audit('Test workspace seeded','Sample orders','Demo data','System');
}
function expireTimers(){
 let ch=false;
 S.orders.forEach(o=>{const t=o.timer;if(!t)return;
  if(t.state==='running'&&now()>=t.deadline){t.state='pickup-offered';t.offeredAt=now();o.alert=true;
   o.hist.push({t:now(),text:'No staff response within 15 minutes. Store pickup offered to the customer. Fulfilment has not been changed.'});
   audit('Delivery timer expired',o.id,'Pickup offered, awaiting customer consent','System');ch=true}
  else if(t.state==='pickup-offered'&&now()>=t.offeredAt+TIMER_MS){t.state='kept-pending';o.alert=true;
   o.hist.push({t:now(),text:'Customer did not reply to the pickup offer. Order stays pending as delivery. Staff alerted.'});
   audit('No customer reply',o.id,'Order kept pending, staff alerted','System');ch=true}});
 return ch}
function applyPayment(o,status,by,ref){o.pay.status=status;o.pay.by=by;o.pay.at=now();if(ref)o.pay.ref=ref;o.hist.push({t:now(),text:'Payment: '+status+(by?' ('+by+')':'')})}
function webhook(orderId,sig){
 const o=S.orders.find(x=>x.id===orderId);
 if(sig!==WEBHOOK_SECRET){audit('Webhook rejected',orderId,'Invalid signature. Browser redirects are never trusted.','Payment gateway');return{ok:false}}
 if(!o||o.pay.method!=='card')return{ok:false};

   else actions+=`<button class="btn sm" data-act="o-next" data-id="${o.id}">Accept order</button>`}
  else if(i>=1&&i<3)actions+=`<button class="btn sm" data-act="o-next" data-id="${o.id}">Mark ${i===1?(o.fulfil==='pickup'?'ready for pickup':'out for delivery'):'completed'}</button>`;
  actions+=`<button class="btn sm ghost" data-act="o-hold" data-id="${o.id}">${o.status==='On Hold'?'Resume':'Put on hold'}</button>`;
 }

 ${o.alert&&!closed?`<div class="alert bad" style="margin-bottom:10px">Needs attention: delivery was not confirmed in time. <button class="btn sm ghost" data-act="o-clear" data-id="${o.id}">Clear alert</button></div>`:''}
 ${canAct?`<div class="acts" style="margin-bottom:10px">${actions}${skip}</div>${can('orders.cancel')?cancel:''}`:`<div class="note">Read-only for ${ROLES[S.role]}.</div>`}

 else if(t&&t.state==='kept-pending')consent=`<div class="alert info">Your order is still waiting for delivery confirmation. Our team has been alerted.</div>`;
 else if(t&&t.state==='running')consent=`<div class="alert info">A team member is confirming delivery. We will respond within 15 minutes: <span class="timer" data-timer="${o.id}">--:--</span></div>`;
 else if(t&&t.state==='confirmed')consent=`<div class="alert ok">Delivery confirmed by our team.</div>`;
 else if(t&&t.state==='pickup-accepted')consent=`<div class="alert ok">Switched to store pickup at your request.</div>`;

 else if(o.pay.status.startsWith('Paid'))pay=`<div class="alert ok">${esc(o.pay.status)}</div>`;
 return `<div class="track"><div class="crow"><div><div class="note">Order number</div><h3 class="mono">${o.id}</h3></div><span class="pill ${pillS[o.status]}">${o.status}</span></div>

function addToCart(id,n){const p=prod(id);if(!p||p.avail==='out')return false;const c=S.cart.find(x=>x.id===id);if(c){c.qty=Math.min(20,c.qty+(n||1))}else S.cart.push({id,qty:Math.min(20,n||1),seen:unitPrice(p)});renderHead();return true}

 const pc=priceCart();const ch=pc.lines.filter(l=>l.changed);
 if(ch.length){S.co.notice='Prices changed since you added items: '+ch.map(l=>esc(l.p.name)+' now '+aed(l.u)).join(', ')+'. Please review the new total.';refreshSeen();return true}

document.addEventListener('click',e=>{

 add:()=>{if(addToCart(id)){const p=prod(id);toast(p.name+' added to cart');if(S.chat.open)renderChatQuick()}},
 wish:()=>{S.wish.has(id)?S.wish.delete(id):S.wish.add(id);renderView()},
 'cart-open':()=>{S.co.step=S.co.step==='done'?1:S.co.step;S.co.notice='';openDrawer()},

  const err=validateCustomer(S.co);const box=$('#co-err');
  if(err){box.textContent=err;box.hidden=false;return}
  if(checkPriceChange()){S.co.step=3;S.co.agree=false;renderDrawer();return}
  S.co.notice='';S.co.step=3;S.co.agree=false;renderDrawer()},
 confirm:()=>{
  const box=$('#co-err');
  if(!S.co.agree){box.textContent='Tick the box to confirm your order.';box.hidden=false;return}
  if(S.co.busy)return;
  if(checkPriceChange()){S.co.agree=false;renderDrawer();return}
  S.co.busy=true;
  const r=serverCreateOrder({key:S.co.key,name:S.co.name,phone:S.co.phone,address:S.co.address,fulfil:S.co.fulfil,pay:S.co.pay,items:S.cart.map(c=>({id:c.id,qty:c.qty}))});

 'of-edit':()=>{if(!guard('offers.edit',id))return;S.editId=id;renderView()},

 'of-save':()=>{

/* ---------- shopping assistant (rule-based, catalogue-grounded) ---------- */
const AR=/[؀-ۿ]/;
const T={
 en:{hi:'Hi, I am Coco, the Coccinelle shopping assistant. I only use our real catalogue and approved offers. What are you looking for today?',
  added:(q,p,u)=>`Added ${q} × ${p.name} (${p.unit}) at AED ${fmt(u)} each.`,nf:'I could not find that in our catalogue. I can pass your question to our team if you like.',
  out:p=>`${p.name} is marked out of stock (updated manually at ${ftime(p.availAt)}), so I cannot add it. Staff can confirm if more is coming.`,
  up:p=>`By the way, ${p.name} (${p.unit}) is on offer at AED ${fmt(p.offer.price)} until ${fdate(p.offer.to)}. Would you like to add it?`,
  nup:'No problem, I will not mention offers again.',empty:'Your cart is empty.',
  sum:(pc)=>pc.lines.map(l=>`${l.qty} × ${l.p.name} = AED ${fmt(l.line)}`).join('\n')+`\nSubtotal AED ${fmt(pc.sub)} · Delivery AED ${fmt(pc.fee)} · Total AED ${fmt(pc.total)}`,
  review:'Ready when you are. Tap the button to review the order. Nothing is ordered until you press Confirm there.',
  hand:'I am passing this to our team. A staff member will follow up. I cannot handle complaints, refunds or payment problems myself.',
  confirmHint:'To place the order, open the review screen and press Confirm order. I cannot confirm it for you.',
  price:(p,u,act)=>`${p.name} (${p.unit}): AED ${fmt(u)}${act?` (offer, regular AED ${fmt(p.price)} until ${fdate(p.offer.to)})`:''}. ${p.avail==='out'?'Currently marked out of stock.':'Stock status is updated manually by staff.'}`,
  offers:'Current approved offers:',noffers:'There are no approved offers right now.',rm:p=>`Removed ${p.name} from your cart.`,
  fallback:'I can help you find products, check prices and offers, build a cart, and open checkout. What would you like?'},
 ar:{hi:'مرحباً، أنا كوكو مساعدة كوكسينيل للتسوق. أستخدم فقط منتجاتنا وعروضنا المعتمدة. ماذا تريد اليوم؟',
  added:(q,p,u)=>`تمت إضافة ${q} × ${p.ar||p.name} بسعر ${fmt(u)} درهم للواحد.`,nf:'لم أجد هذا المنتج في الكتالوج. يمكنني تحويل سؤالك إلى فريقنا.',
  out:p=>`${p.ar||p.name} غير متوفر حالياً (يحدّث الموظفون الحالة يدوياً).`,
  up:p=>`بالمناسبة، ${p.ar||p.name} (${p.unit}) بعرض ${fmt(p.offer.price)} درهم حتى ${fdate(p.offer.to)}. هل تريد إضافته؟`,
  nup:'لا مشكلة، لن أذكر العروض مرة أخرى.',empty:'سلتك فارغة.',
  sum:(pc)=>pc.lines.map(l=>`${l.qty} × ${l.p.ar||l.p.name} = ${fmt(l.line)} درهم`).join('\n')+`\nالمجموع ${fmt(pc.total)} درهم (التوصيل ${fmt(pc.fee)})`,
  review:'اضغط الزر لمراجعة الطلب. لا يتم أي طلب حتى تضغط تأكيد هناك.',
  hand:'سأحوّل طلبك إلى فريقنا وسيتواصل معك أحد الموظفين.',
  confirmHint:'لإتمام الطلب افتح شاشة المراجعة واضغط تأكيد الطلب. لا أستطيع التأكيد نيابةً عنك.',
  price:(p,u,act)=>`${p.ar||p.name} (${p.unit}): ${fmt(u)} درهم${act?` (عرض، السعر العادي ${fmt(p.price)})`:''}.`,
  offers:'العروض المعتمدة حالياً:',noffers:'لا توجد عروض معتمدة الآن.',rm:p=>`تمت إزالة ${p.ar||p.name} من السلة.`,
  fallback:'يمكنني مساعدتك في إيجاد المنتجات والأسعار والعروض وبناء السلة. ماذا تريد؟'}};
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,واحد:1,اثنين:2,ثلاثة:3,اربعة:4,خمسة:5};
function stem(w){return w.toLowerCase().replace(/(es|s)$/,'')}
function findProducts(msg){
 const m=msg.toLowerCase();const out=[];
 S.products.forEach(p=>{const toks=p.name.toLowerCase().split(/\s+/).filter(w=>w.length>3&&!['fresh','fruit','free-range','organic','mixed'].includes(w)).map(stem);
  const hit=toks.some(t=>m.includes(t))||(p.ar&&p.ar.split(' ').some(w=>w.length>2&&msg.includes(w)));
  if(hit)out.push(p)});
 return out}
function qtyOf(msg){const d=msg.match(/\b(\d{1,2})\b/);if(d)return Math.min(20,+d[1]);const w=msg.toLowerCase().split(/\s+/).find(x=>NUMW[x]);return w?NUMW[w]:1}
function say(t,who,quick){S.chat.msgs.push({t,who,quick});renderChat()}
function openChat(){S.chat.open=true;if(!S.chat.started){S.chat.started=true;S.chat.msgs.push({t:T.en.hi,who:'bot'})}$('#chat').classList.add('on');$('#chatfab').style.display='none';renderChat();setTimeout(()=>{const i=$('#chatin');if(i)i.focus()},50)}
function closeChat(){S.chat.open=false;$('#chat').classList.remove('on');$('#chatfab').style.display='flex'}
function renderChat(){
 const c=$('#chat');const last=S.chat.msgs[S.chat.msgs.length-1];
 const quick=(last&&last.who==='bot'&&last.quick)||(S.chat.msgs.length===1?['What offers do you have?','Add 2 oranges','Show my cart']:[]);
 c.innerHTML=`<header><div><b>Coco, shopping assistant</b><small>Uses catalogue data only. Test mode.</small></div><button class="xbtn" data-chat="close" aria-label="Close assistant" style="background:rgba(255,255,255,.2);color:#fff">&times;</button></header><div class="msgs" id="msgs" aria-live="polite">${S.chat.msgs.map(m=>`<div class="m ${m.who}">${esc(m.t)}</div>`).join('')}</div><div class="quick">${quick.map(q=>`<button type="button" data-chat="q" data-q="${esc(typeof q==='string'?q:q.send)}">${esc(typeof q==='string'?q:q.label)}</button>`).join('')}</div><form id="chatform"><label class="sr" for="chatin">Message</label><input id="chatin" placeholder="Type a message..." autocomplete="off"><button class="btn sm" type="submit">Send</button></form>`;
 const m=$('#msgs');m.scrollTop=m.scrollHeight}
function renderChatQuick(){}
function userSay(v){S.chat.msgs.push({t:v,who:'me'});reply(v);}
function handoff(v,reason,L){S.handoffs.unshift({t:now(),text:v,reason,lang:S.chat.lang});audit('Assistant handoff',reason,v.slice(0,80),'Assistant');say(L.hand,'bot')}
function reply(v){
 const ar=AR.test(v);S.chat.lang=ar?'ar':'en';const L=T[S.chat.lang];const m=v.toLowerCase();
 if(/(refund|complain|complaint|human|staff|manager|damaged|wrong item|payment (issue|problem)|charged|مشكلة|شكوى|موظف)/i.test(v))return handoff(v,/refund|payment|charged/i.test(v)?'Payment or refund issue':'Complaint or human request',L);
 if(S.chat.upsell==='offered'){
  if(/^(no|nope|not now|no thanks|no thank you|لا)/i.test(m.trim())||/لا شكرا/.test(v)){S.chat.upsell='declined';return say(L.nup,'bot')}
  if(/^(yes|yeah|sure|ok|okay|add it|yep|نعم|اضف)/i.test(m.trim())&&S.chat.offerId){const p=prod(S.chat.offerId);S.chat.upsell='accepted';addToCart(p.id,1);return say(L.added(1,p,unitPrice(p)),'bot',[{label:'Show my cart',send:'cart'}])}}
 if(/^(hi|hello|hey|salam|مرحبا|السلام)/i.test(m.trim()))return say(L.hi,'bot');
 if(/(offer|deal|sale|discount|عرض|عروض)/i.test(m)){const act=S.products.filter(offerActive);return say(act.length?L.offers+'\n'+act.map(p=>`• ${p.ar&&ar?p.ar:p.name} ${p.unit}: AED ${fmt(p.offer.price)} (was ${fmt(p.price)})`).join('\n'):L.noffers,'bot')}
 if(/(^cart$|my cart|basket|show cart|سلة|السلة)/i.test(m)){const pc=priceCart();return say(S.cart.length?L.sum(pc):L.empty,'bot',S.cart.length?[{label:'Checkout',send:'checkout'}]:null)}
 if(/(checkout|check out|place (the )?order|pay|اطلب|الدفع)/i.test(m)){if(!S.cart.length)return say(L.empty,'bot');say(L.sum(priceCart())+'\n\n'+L.review,'bot');S.co.step=2;setTimeout(()=>{openDrawer()},400);return}
 if(/^(yes confirm|confirm|i confirm|confirm order|تأكيد)/i.test(m.trim()))return say(L.confirmHint,'bot');
 if(/(remove|delete|take out|احذف|ازل)/i.test(m)){const ps=findProducts(v);if(ps.length&&S.cart.some(c=>c.id===ps[0].id)){S.cart=S.cart.filter(c=>c.id!==ps[0].id);renderHead();return say(L.rm(ps[0]),'bot')}return say(L.nf,'bot')}
 const ps=findProducts(v);
 if(ps.length){const p=ps[0];
  if(/(price|how much|cost|بكم|سعر)/i.test(m)&&!/(add|want|need|get|buy|اضف|أريد)/i.test(m))return say(L.price(p,unitPrice(p),offerActive(p)),'bot',p.avail==='out'?null:[{label:'Add 1 '+p.name,send:'add 1 '+p.name}]);
  if(p.avail==='out')return say(L.out(p),'bot');
  const q=qtyOf(v);addToCart(p.id,q);let txt=L.added(q,p,unitPrice(p));
  if(S.chat.upsell==='none'){const cand=S.products.filter(x=>offerActive(x)&&!S.cart.some(c=>c.id===x.id)&&x.avail!=='out');const pick=cand.find(x=>x.cat!==p.cat)||cand[0];
   if(pick){S.chat.upsell='offered';S.chat.offerId=pick.id;txt+='\n\n'+L.up(pick);return say(txt,'bot',[{label:'Yes, add it',send:'yes'},{label:'No thanks',send:'no thanks'}])}}
  return say(txt,'bot',[{label:'Show my cart',send:'cart'},{label:'Checkout',send:'checkout'}])}
 if(/(add|want|need|buy|get|do you have|have you|اضف|أريد)/i.test(m)){return handoff(v,'Product not in catalogue',L)}
 say(L.fallback,'bot');
}

/* ---------- boot ---------- */
seedOrders();S.sel=S.orders[0]&&S.orders[0].id;
const h=location.hash.replace('#','');
if(['shop','staff','offers'].includes(h))S.view=h;
renderView();
setInterval(()=>{if(expireTimers()){renderTracking();if(S.view==='staff')renderView()}updateTimers()},1000);
window.__cc={S,serverCreateOrder,priceCart,unitPrice,offerActive,webhook,expireTimers,reply,findProducts,calc,eligibility,go,PERM,addToCart};
})();
